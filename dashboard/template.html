<title>SEMI Exhibitor Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a fab-floor instrument panel — progress strip on top, three breakdown panels, then the full company register. */
:root {
  --bg: #f3f4f1;          /* cleanroom off-white, slightly green-grey */
  --panel: #ffffff;
  --ink: #1b2126;
  --muted: #5d676e;
  --line: #d9ddd8;
  --accent: #b76e00;      /* lithography yellow-room amber */
  --accent-soft: #f4e3c4;
  --bar: #3d5a6c;         /* wafer-steel blue for data marks */
  --bar-soft: #dbe3e7;
  --ok: #2f7d4f; --warn: #b36b00; --bad: #a33b3b;
  --ok-bg: #e1efe5; --warn-bg: #f6e9d3; --bad-bg: #f3e0de;
  --display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121518; --panel: #1a1f23; --ink: #e6e9e7; --muted: #99a3a8; --line: #2c3338;
  --accent: #f0a93b; --accent-soft: #3a2c14; --bar: #8fb3c7; --bar-soft: #25323a;
  --ok: #6cc28e; --warn: #f0a93b; --bad: #e58a84; --ok-bg: #1c3024; --warn-bg: #3a2c14; --bad-bg: #3a1f1f;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121518; --panel: #1a1f23; --ink: #e6e9e7; --muted: #99a3a8; --line: #2c3338;
  --accent: #f0a93b; --accent-soft: #3a2c14; --bar: #8fb3c7; --bar-soft: #25323a;
  --ok: #6cc28e; --warn: #f0a93b; --bad: #e58a84; --ok-bg: #1c3024; --warn-bg: #3a2c14; --bad-bg: #3a1f1f;
  color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--body); }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 56px; display: grid; gap: 22px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
h1 { font: 600 30px/1.1 var(--display); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
h1 span { color: var(--accent); }
.stamp { font: 12px var(--mono); color: var(--muted); }
h2 { font: 600 13px var(--display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 18px; min-width: 0; }

.progress { display: grid; gap: 14px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 18px; }
.kpi b { display: block; font: 600 28px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.kpi small { color: var(--muted); font-size: 12px; }
.strip { display: flex; height: 12px; border-radius: 3px; overflow: hidden; background: var(--bar-soft); }
.strip i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; background: var(--c); vertical-align: -1px; }

.grid3 { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 22px; }
@media (max-width: 900px) { .grid3 { grid-template-columns: 1fr; } }
.bars { display: grid; gap: 7px; }
.brow { display: grid; grid-template-columns: minmax(0, 1fr) 42px; gap: 4px 10px; align-items: center; cursor: pointer; border-radius: 4px; padding: 2px 4px; margin-inline: -4px; }
.brow:hover, .brow:focus-visible { background: var(--bar-soft); outline: none; }
.brow.on .lbl { color: var(--accent); font-weight: 600; }
.lbl { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lbl code { font: 11px var(--mono); color: var(--muted); margin-right: 6px; }
.num { font: 12px var(--mono); text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.track { grid-column: 1 / -1; height: 6px; background: var(--bar-soft); border-radius: 3px; }
.track i { display: block; height: 100%; background: var(--bar); border-radius: 3px; }
.brow.on .track i { background: var(--accent); }

.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.filters input, .filters select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 7px 10px; min-width: 0; }
.filters input { flex: 1 1 240px; }
.filters select { flex: 0 1 190px; }
.filters button { font: inherit; background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 4px; padding: 7px 12px; cursor: pointer; }
.filters button:hover { border-color: var(--accent); color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.count { font: 12px var(--mono); color: var(--muted); margin-left: auto; }

.tablebox { overflow-x: auto; margin-inline: -18px; }
table { width: 100%; border-collapse: collapse; min-width: 760px; }
th { font: 600 11px var(--display); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); cursor: pointer; white-space: nowrap; user-select: none; }
th:first-child, td:first-child { padding-left: 18px; }
th[aria-sort] { color: var(--accent); }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr.row { cursor: pointer; }
tr.row:hover td { background: var(--bar-soft); }
.nm { font-weight: 600; }
.sub { font-size: 12px; color: var(--muted); }
.mono { font: 12px var(--mono); }
.pill { display: inline-block; font: 500 11px var(--mono); padding: 2px 7px; border-radius: 10px; white-space: nowrap; }
.pill.complete { background: var(--ok-bg); color: var(--ok); }
.pill.partial { background: var(--warn-bg); color: var(--warn); }
.pill.not_found { background: var(--bad-bg); color: var(--bad); }
.conf { display: inline-block; width: 44px; height: 5px; background: var(--bar-soft); border-radius: 3px; vertical-align: middle; margin-left: 6px; }
.conf i { display: block; height: 100%; background: var(--bar); border-radius: 3px; }
tr.detail td { background: var(--bg); padding: 14px 18px 18px; }
.dgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px 24px; max-width: 1000px; }
.dgrid div { min-width: 0; overflow-wrap: anywhere; }
.dgrid dt { font: 600 11px var(--display); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.dgrid dd { margin: 2px 0 0; }
.desc { max-width: 70ch; margin: 0 0 12px; }
a { color: var(--accent); }
.empty { padding: 28px 18px; color: var(--muted); }
.more { display: flex; justify-content: center; padding-top: 14px; }
.more button { font: inherit; background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 4px; padding: 7px 16px; cursor: pointer; }
</style>

<div class="wrap">
  <header>
    <h1>SEMI Exhibitor <span>Atlas</span></h1>
    <div class="stamp" id="stamp"></div>
  </header>

  <section class="panel progress" aria-label="Research progress">
    <div class="kpis" id="kpis"></div>
    <div class="strip" id="strip" role="img"></div>
    <div class="legend" id="legend"></div>
  </section>

  <div class="grid3">
    <section class="panel"><h2>SEMI category group</h2><div class="bars" id="b-cat"></div></section>
    <section class="panel"><h2>Headquarters country</h2><div class="bars" id="b-country"></div></section>
    <section class="panel"><h2>Value-chain role</h2><div class="bars" id="b-role"></div></section>
  </div>

  <section class="panel">
    <div class="filters">
      <input id="q" type="search" placeholder="Search name, product, city, parent…" aria-label="Search companies">
      <select id="f-status" aria-label="Status"><option value="">All statuses</option><option value="complete">Complete</option><option value="partial">Partial</option><option value="not_found">Not found</option></select>
      <select id="f-cat" aria-label="Category group"><option value="">All categories</option></select>
      <select id="f-country" aria-label="Country"><option value="">All countries</option></select>
      <select id="f-role" aria-label="Value-chain role"><option value="">All roles</option></select>
      <button id="reset" type="button">Clear filters</button>
      <span class="count" id="count"></span>
    </div>
    <div class="tablebox" style="margin-top:14px">
      <table>
        <thead><tr>
          <th data-k="name">Company</th><th data-k="primary_category_group">Category</th>
          <th data-k="hq_country">HQ</th><th data-k="employee_range">Employees</th>
          <th data-k="value_chain_role">Role</th><th data-k="status">Status</th>
        </tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
    <div class="more"><button id="more" type="button" hidden>Show more</button></div>
  </section>
</div>

<script>
let D = /*__DATA__*/null;
let C = D.companies;
const G = D.groups;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => n.toLocaleString("en-US");
const ROLE = r => (r || "unknown").replace(/_/g, " ");
const COUNTRY = (() => { try { const dn = new Intl.DisplayNames(["en"], {type: "region"}); return c => { try { return c ? dn.of(c) : "Unknown"; } catch { return c; } }; } catch { return c => c || "Unknown"; } })();
const state = { q: "", status: "", cat: "", country: "", role: "", sort: "name", dir: 1, shown: 100 };

// --- summary ---
const by = (arr, f) => arr.reduce((m, x) => (m[f(x)] = (m[f(x)] || 0) + 1, m), {});
function summary() {
const st = by(C, c => c.status);
const researchedPct = D.total_exhibitors ? Math.round(100 * C.length / D.total_exhibitors) : 0;
$("#stamp").textContent = `Data as of ${D.generated_utc.replace("T", " ").replace("Z", " UTC")}`;
const withSite = C.filter(c => c.website).length, withLi = C.filter(c => c.linkedin_url).length;
$("#kpis").innerHTML = [
  [fmt(C.length), `companies in the database · ${researchedPct}% of ${fmt(D.total_exhibitors)} exhibitors`],
  [fmt(st.complete || 0), "complete records"],
  [fmt(st.partial || 0), "partial records"],
  [fmt(st.not_found || 0), "not found"],
  [`${C.length ? Math.round(100 * withSite / C.length) : 0}%`, "have a website"],
  [`${C.length ? Math.round(100 * withLi / C.length) : 0}%`, "have a LinkedIn page"],
].map(([v, l]) => `<div class="kpi"><b>${v}</b><small>${l}</small></div>`).join("");
const segs = [["complete", "var(--ok)", "Complete"], ["partial", "var(--warn)", "Partial"], ["not_found", "var(--bad)", "Not found"]];
const tot = Math.max(D.total_exhibitors, C.length) || 1;
$("#strip").innerHTML = segs.map(([k, c]) => `<i style="width:${100 * (st[k] || 0) / tot}%;background:${c}"></i>`).join("");
$("#strip").setAttribute("aria-label", `${C.length} of ${D.total_exhibitors} exhibitors researched`);
$("#legend").innerHTML = segs.map(([k, c, l]) => `<span style="--c:${c}">${l} ${fmt(st[k] || 0)}</span>`).join("")
  + `<span style="--c:var(--bar-soft)">Not yet researched ${fmt(Math.max(0, D.total_exhibitors - C.length))}</span>`;
}
summary();

// --- breakdown bars (click = filter) ---
function bars(el, key, counts, label, limit) {
  const rows = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, limit);
  const max = Math.max(1, ...rows.map(r => r[1]));
  el.innerHTML = rows.map(([k, n]) => `<div class="brow${state[key] === k ? " on" : ""}" tabindex="0" role="button" data-k="${esc(k)}" aria-pressed="${state[key] === k}">
    <span class="lbl">${label(k)}</span><span class="num">${n}</span><span class="track"><i style="width:${100 * n / max}%"></i></span></div>`).join("");
  el.onclick = el.onkeydown = e => {
    if (e.type === "keydown" && e.key !== "Enter" && e.key !== " ") return;
    const r = e.target.closest(".brow"); if (!r) return; e.preventDefault();
    state[key] = state[key] === r.dataset.k ? "" : r.dataset.k; syncSelects(); render();
  };
}
const catLabel = k => k === "none" ? "Uncategorized" : `<code>${esc(k)}</code>${esc(G[k] || "")}`;
function drawBars(rows) {
  bars($("#b-cat"), "cat", by(rows, c => c.primary_category_group || "none"), catLabel, 14);
  bars($("#b-country"), "country", by(rows, c => c.hq_country || "none"), k => esc(k === "none" ? "Unknown" : COUNTRY(k)), 14);
  bars($("#b-role"), "role", by(rows, c => c.value_chain_role || "none"), k => esc(k === "none" ? "Unknown" : ROLE(k)), 14);
}

// --- filters ---
const opts = (sel, counts, label) => Object.keys(counts).sort((a, b) => label(a).localeCompare(label(b)))
  .forEach(k => sel.insertAdjacentHTML("beforeend", `<option value="${esc(k)}">${esc(label(k))} (${counts[k]})</option>`));
opts($("#f-cat"), by(C, c => c.primary_category_group || "none"), k => k === "none" ? "Uncategorized" : `${k} ${G[k] || ""}`);
opts($("#f-country"), by(C, c => c.hq_country || "none"), k => k === "none" ? "Unknown" : COUNTRY(k));
opts($("#f-role"), by(C, c => c.value_chain_role || "none"), k => k === "none" ? "Unknown" : ROLE(k));
function syncSelects() { $("#f-status").value = state.status; $("#f-cat").value = state.cat; $("#f-country").value = state.country; $("#f-role").value = state.role; }
[["#f-status", "status"], ["#f-cat", "cat"], ["#f-country", "country"], ["#f-role", "role"]].forEach(([s, k]) => $(s).onchange = e => { state[k] = e.target.value; state.shown = 100; render(); });
$("#q").oninput = e => { state.q = e.target.value.trim().toLowerCase(); state.shown = 100; render(); };
$("#reset").onclick = () => { Object.assign(state, { q: "", status: "", cat: "", country: "", role: "", shown: 100 }); $("#q").value = ""; syncSelects(); render(); };
$("#more").onclick = () => { state.shown += 200; render(); };
document.querySelectorAll("th").forEach(th => th.onclick = () => {
  const k = th.dataset.k; state.dir = state.sort === k ? -state.dir : 1; state.sort = k; render();
});

const hay = c => [c.name, c.parent_company, c.hq_city, c.description, c.primary_subcategory_name, c.primary_category_group_name, c.stock_ticker, c.events_flat].join(" ").toLowerCase();
C.forEach(c => c._h = hay(c));
function filtered() {
  return C.filter(c => (!state.q || c._h.includes(state.q))
    && (!state.status || c.status === state.status)
    && (!state.cat || (c.primary_category_group || "none") === state.cat)
    && (!state.country || (c.hq_country || "none") === state.country)
    && (!state.role || (c.value_chain_role || "none") === state.role));
}

// --- table ---
const open = new Set();
function detail(c) {
  const f = (l, v) => v ? `<div><dt>${l}</dt><dd>${v}</dd></div>` : "";
  const link = u => u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, ""))}</a>` : "";
  return `<tr class="detail"><td colspan="6">${c.description ? `<p class="desc">${esc(c.description)}</p>` : ""}<dl class="dgrid">
    ${f("Website", link(c.website))}${f("LinkedIn", link(c.linkedin_url))}
    ${f("Subcategory", c.primary_subcategory ? `<span class="mono">${esc(c.primary_subcategory)}</span> ${esc(c.primary_subcategory_name || "")}` : "")}
    ${f("Headquarters", esc([c.hq_city, COUNTRY(c.hq_country), c.hq_region].filter(Boolean).join(", ")))}
    ${f("Parent company", esc(c.parent_company))}${f("Ownership", esc(c.ownership_type))}${f("Ticker", esc(c.stock_ticker))}
    ${f("Founded", esc(c.founded_year))}${f("Shows and booths", esc(c.events_flat))}
    ${f("Confidence", c.confidence != null ? esc(Math.round(c.confidence * 100) + "%") : "")}
  </dl></td></tr>`;
}
function render() {
  const rows = filtered();
  const k = state.sort, dir = state.dir;
  rows.sort((a, b) => String(a[k] ?? "~").localeCompare(String(b[k] ?? "~"), "en", { numeric: true }) * dir);
  document.querySelectorAll("th").forEach(th => th.dataset.k === k ? th.setAttribute("aria-sort", dir > 0 ? "ascending" : "descending") : th.removeAttribute("aria-sort"));
  $("#count").textContent = `${fmt(rows.length)} of ${fmt(C.length)} companies`;
  const page = rows.slice(0, state.shown);
  $("#tb").innerHTML = page.length ? page.map((c, i) => {
    const id = c.name + "|" + (c.website || "");
    const loc = [c.hq_city, c.hq_country].filter(Boolean).join(", ");
    return `<tr class="row" data-id="${esc(id)}" tabindex="0" aria-expanded="${open.has(id)}">
      <td><div class="nm">${esc(c.name)}</div>${c.parent_company ? `<div class="sub">${esc(c.parent_company)}</div>` : ""}</td>
      <td>${c.primary_category_group ? `<span class="mono">${esc(c.primary_subcategory || c.primary_category_group)}</span><div class="sub">${esc(c.primary_subcategory_name || c.primary_category_group_name || "")}</div>` : `<span class="sub">—</span>`}</td>
      <td>${esc(loc) || `<span class="sub">—</span>`}</td>
      <td class="mono">${esc(c.employee_range && c.employee_range !== "unknown" ? c.employee_range : "—")}</td>
      <td>${esc(ROLE(c.value_chain_role))}</td>
      <td><span class="pill ${esc(c.status)}">${esc(c.status.replace("_", " "))}</span>${c.confidence != null ? `<span class="conf" title="confidence ${Math.round(c.confidence * 100)}%"><i style="width:${c.confidence * 100}%"></i></span>` : ""}</td>
    </tr>${open.has(id) ? detail(c) : ""}`;
  }).join("") : `<tr><td colspan="6" class="empty">No companies match these filters. Clear a filter or change the search.</td></tr>`;
  $("#more").hidden = rows.length <= state.shown;
  drawBars(rows);
}
$("#tb").onclick = $("#tb").onkeydown = e => {
  if (e.type === "keydown" && e.key !== "Enter") return;
  if (e.target.closest("a")) return;
  const r = e.target.closest("tr.row"); if (!r) return;
  const id = r.dataset.id; open.has(id) ? open.delete(id) : open.add(id); render();
};
render();

// Live mode: when served next to dashboard-data.json (local server), re-read it every 30 s.
// On the published page the fetch fails quietly and the embedded snapshot stays.
async function refresh() {
  try {
    const r = await fetch("dashboard-data.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return;
    const nd = await r.json();
    if (nd.generated_utc === D.generated_utc) return;
    D = nd; C = nd.companies; C.forEach(c => c._h = hay(c));
    summary(); render();
    $("#stamp").textContent += " · live";
  } catch (e) { /* not served locally */ }
}
if (location.protocol.startsWith("http") && /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
  refresh(); setInterval(refresh, 30000);
}
</script>
